<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="LocaLoom - Connect. Discover. Experience." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#ec4899;#8b5cf6;#06b6d4;#f97316" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#06b6d4;#f97316;#ec4899" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#f97316;#ec4899;#8b5cf6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="titleClip">
      <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="2">LocaLoom</text>
    </clipPath>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Animated gradient background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Floating blobs -->
  <g fill="#fff">
    <circle cx="140" cy="80" r="70" opacity="0.10">
      <animate attributeName="cy" values="80;130;80" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="70" r="90" opacity="0.08">
      <animate attributeName="cy" values="70;20;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="210" r="40" opacity="0.10">
      <animate attributeName="cx" values="880;940;880" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="220" r="30" opacity="0.12">
      <animate attributeName="cy" values="220;180;220" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling sparkles -->
  <g fill="#fff">
    <circle cx="220" cy="50" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="40" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="150" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="200" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="230" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Pulsing location ripples behind the pin -->
  <g fill="none" stroke="#fff" stroke-width="2">
    <circle cx="372" cy="150" r="10" opacity="0">
      <animate attributeName="r" values="10;60" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="372" cy="150" r="10" opacity="0">
      <animate attributeName="r" values="10;60" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bouncing map pin -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M372 96c-19 0-34 15-34 34 0 26 34 62 34 62s34-36 34-62c0-19-15-34-34-34z" fill="#fff" filter="url(#glow)"/>
    <circle cx="372" cy="130" r="13" fill="#ec4899"/>
  </g>

  <!-- Title with shimmer sweep -->
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="#fff" filter="url(#glow)">
    LocaLoom
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <g clip-path="url(#titleClip)">
    <rect x="-300" y="60" width="260" height="140" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1400" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tagline -->
  <text x="600" y="218" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="8" fill="#fff">
    CONNECT • DISCOVER • EXPERIENCE
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
  </text>

  <!-- Sub tagline -->
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fff" opacity="0.9">
    Your neighbourhood awaits — Delhi's local events, all in one place
  </text>

  <!-- Wave layers -->
  <path d="M0 282 Q150 252 300 282 T600 282 T900 282 T1200 282 T1500 282 T1800 282 T2100 282 T2400 282 V340 H0 Z" fill="#fff" opacity="0.18">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 296 Q150 270 300 296 T600 296 T900 296 T1200 296 T1500 296 T1800 296 T2100 296 T2400 296 V340 H0 Z" fill="#fff" opacity="0.28">
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Scrolling category marquee -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="2">
    <text x="0" y="326">
      HERITAGE WALKS  ✦  FOOD WALKS  ✦  FITNESS  ✦  LEARN  ✦  VOLUNTEER  ✦  SOCIAL  ✦  HERITAGE WALKS  ✦  FOOD WALKS  ✦  FITNESS  ✦  LEARN  ✦  VOLUNTEER  ✦  SOCIAL  ✦  HERITAGE WALKS  ✦  FOOD WALKS  ✦  FITNESS  ✦  LEARN  ✦  VOLUNTEER  ✦  SOCIAL  ✦
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1130 0" dur="25s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
